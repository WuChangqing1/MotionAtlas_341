<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>完成之后 · film</title>
<style>
  html, body { margin: 0; padding: 0; background: #140e0b; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script>
(() => {
'use strict';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

const C = {
  paper: '#F0E4C8',
  paperLight: '#F7EEDC',
  paperShade: '#E3D2B0',
  pencil: '#3A363A',
  ink: '#34221C',
  rose: '#C88F76',
  lavender: '#9C8AA0',
  ochre: '#DEBE87',
  brass: '#C9A15E',
  brassDark: '#8B6A3F',
  sage: '#7C8B6B',
  rust: '#B4553F',
  ivory: '#F6EBD0',
  gold: '#E8C98A',
  desk: '#1B1310'
};

const FONT = '"STSong","SimSun","Noto Serif SC","Songti SC",serif';

/* ---------- deterministic RNG ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rndRange(r, a, b) { return a + (b - a) * r(); }
function clamp01(v) { return Math.max(0, Math.min(1, v)); }

/* ---------- canvas cache ---------- */
function makePaper() {
  const c = document.createElement('canvas');
  c.width = 1500; c.height = 900;
  const g = c.getContext('2d');
  g.fillStyle = C.paper; g.fillRect(0, 0, 1500, 900);

  const r = mulberry32(20261101);
  // broad tonal wash
  for (let i = 0; i < 16; i++) {
    const x = r() * 1500, y = r() * 900, rad = 180 + r() * 420;
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    const warm = r() > .45;
    grd.addColorStop(0, warm ? 'rgba(222,190,135,0.10)' : 'rgba(200,143,118,0.06)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  // fibers
  for (let i = 0; i < 1400; i++) {
    const x = r() * 1500, y = r() * 900;
    const len = 5 + r() * 26, a = (r() - .5) * .65;
    g.strokeStyle = `rgba(${105 + r() * 30 | 0},${78 + r() * 25 | 0},${48 + r() * 22 | 0},${0.035 + r() * 0.05})`;
    g.lineWidth = .5 + r() * .8;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke();
  }
  // foxing / water stains
  for (let i = 0; i < 26; i++) {
    const x = r() * 1500, y = r() * 900, rad = 8 + r() * 55;
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    grd.addColorStop(0, `rgba(155,115,72,${0.05 + r() * 0.08})`);
    grd.addColorStop(.65, `rgba(175,135,88,${0.03 + r() * 0.04})`);
    grd.addColorStop(1, 'rgba(175,135,88,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
  }
  // edge darkening
  const edge = g.createLinearGradient(0, 0, 0, 900);
  edge.addColorStop(0, 'rgba(120,85,50,0.10)');
  edge.addColorStop(.12, 'rgba(120,85,50,0)');
  edge.addColorStop(.88, 'rgba(120,85,50,0)');
  edge.addColorStop(1, 'rgba(120,85,50,0.12)');
  g.fillStyle = edge; g.fillRect(0, 0, 1500, 900);

  // fine grain
  const img = g.getImageData(0, 0, 1500, 900);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - .5) * 9;
    d[i] = Math.max(0, Math.min(255, d[i] + n));
    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n * .85));
    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n * .65));
  }
  g.putImageData(img, 0, 0);
  return c;
}

function makeSprite(color, core) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, core);
  grd.addColorStop(.22, color);
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.beginPath(); g.arc(32, 32, 32, 0, Math.PI * 2); g.fill();
  return c;
}

function makeGearSprite() {
  const size = 380, cx = 190, cy = 190, R = 118, body = 100;
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const g = c.getContext('2d');
  g.translate(cx, cy);

  // gear silhouette: body + 12 teeth
  g.beginPath();
  g.arc(0, 0, body, 0, Math.PI * 2);
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI * 2 / 12;
    g.save();
    g.rotate(a);
    g.rect(-13, -R - 20, 26, 26);
    g.restore();
  }
  const grd = g.createLinearGradient(-130, -130, 130, 130);
  grd.addColorStop(0, '#EBD09A');
  grd.addColorStop(.42, C.brass);
  grd.addColorStop(1, '#8E683D');
  g.fillStyle = grd; g.fill();

  // watercolor variation + hatching, clipped to the gear pixels
  g.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 5; i++) {
    const x = -90 + i * 42, y = -60 + (i % 3) * 55, rad = 55 + i * 10;
    const wg = g.createRadialGradient(x, y, 0, x, y, rad);
    wg.addColorStop(0, i % 2 ? 'rgba(255,232,180,0.20)' : 'rgba(125,82,45,0.16)');
    wg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = wg; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
  }
  for (let i = -170; i < 180; i += 9) {
    g.strokeStyle = 'rgba(70,50,32,0.18)';
    g.lineWidth = 1.1;
    g.beginPath(); g.moveTo(-150, i); g.lineTo(150, i - 180); g.stroke();
  }
  g.globalCompositeOperation = 'source-over';

  // ink construction outline
  g.strokeStyle = 'rgba(52,34,28,0.55)';
  g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, body, 0, Math.PI * 2); g.stroke();
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI * 2 / 12;
    g.save(); g.rotate(a); g.strokeRect(-13, -R - 20, 26, 26); g.restore();
  }

  // notch + hub cutouts
  g.globalCompositeOperation = 'destination-out';
  g.fillRect(-14, -R - 24, 28, 58);
  g.beginPath(); g.arc(0, 0, 28, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'source-over';

  // cut edges
  g.strokeStyle = 'rgba(52,34,28,0.80)';
  g.lineWidth = 2.2;
  g.beginPath();
  g.moveTo(-14, -R - 24); g.lineTo(-14, -R + 34);
  g.lineTo(14, -R + 34); g.lineTo(14, -R - 24);
  g.stroke();
  g.beginPath(); g.arc(0, 0, 28, 0, Math.PI * 2); g.stroke();

  // tooth roots + serial
  g.strokeStyle = 'rgba(52,34,28,0.28)'; g.lineWidth = 1.4;
  g.beginPath(); g.arc(0, 0, body, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(52,34,28,0.62)';
  g.font = `600 18px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('07', 0, 62);

  return c;
}

/* ---------- drawing helpers ---------- */
function drawText(g, text, x, y, size, color, opt = {}) {
  const weight = opt.weight || 400;
  const align = opt.align || 'left';
  const baseline = opt.baseline || 'middle';
  g.save();
  g.font = `${weight} ${size}px ${FONT}`;
  g.textAlign = align; g.textBaseline = baseline;
  if (opt.halo) {
    g.lineWidth = Math.max(2, size * .075);
    g.strokeStyle = opt.halo;
    g.lineJoin = 'round';
    g.strokeText(text, x, y);
  }
  g.fillStyle = color;
  g.fillText(text, x, y);
  g.restore();
}

function softShadow(g, x, y, rx, ry, color, blur = 18) {
  g.save();
  g.filter = `blur(${blur}px)`;
  g.fillStyle = color;
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill();
  g.restore();
}

function wash(g, x, y, rx, ry, color, alpha, rot = 0) {
  const baseAlpha = g.globalAlpha;
  g.save();
  g.translate(x, y); g.rotate(rot);
  g.globalAlpha = baseAlpha * alpha;
  g.filter = 'blur(24px)';
  const grd = g.createRadialGradient(0, 0, 0, 0, 0, Math.max(rx, ry));
  grd.addColorStop(0, color);
  grd.addColorStop(.52, color);
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); g.fill();
  g.restore();

  g.save();
  g.translate(x, y); g.rotate(rot);
  g.globalAlpha = baseAlpha * alpha * .55;
  g.filter = 'blur(2px)';
  g.strokeStyle = color; g.lineWidth = 3;
  g.beginPath(); g.ellipse(0, 0, rx * .92, ry * .92, 0, 0, Math.PI * 2); g.stroke();
  g.restore();
}

function roughLine(g, pts, color, width, seed = 1, alpha = 1) {
  const r = mulberry32(seed);
  g.save();
  g.strokeStyle = color; g.lineCap = 'round'; g.lineJoin = 'round';
  for (let pass = 0; pass < 2; pass++) {
    g.globalAlpha = alpha * (pass ? .45 : .9);
    g.lineWidth = width * (pass ? .65 : 1);
    g.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const jx = (r() - .5) * 1.6, jy = (r() - .5) * 1.6;
      if (i === 0) g.moveTo(pts[i][0] + jx, pts[i][1] + jy);
      else g.lineTo(pts[i][0] + jx, pts[i][1] + jy);
    }
    g.stroke();
  }
  g.restore();
}

function roughCircle(g, cx, cy, radius, color, width, seed, alpha = 1) {
  const r = mulberry32(seed);
  g.save();
  g.strokeStyle = color; g.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    g.globalAlpha = alpha * (pass ? .5 : .9);
    g.lineWidth = width * (pass ? .7 : 1);
    g.beginPath();
    for (let i = 0; i <= 72; i++) {
      const a = i / 72 * Math.PI * 2;
      const rr = radius + (r() - .5) * 2.2;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath(); g.stroke();
  }
  g.restore();
}

function drawParticles(g, pts, sizeScale = 1, alpha = 1, opt = {}) {
  const blend = opt.blend || 'lighter';
  const halo = !!opt.halo;
  g.save();
  for (const p of pts) {
    const s = (p.s || 2) * sizeScale;
    const a = Math.min(1, (p.a == null ? .55 : p.a) * alpha);
    if (halo) {
      g.globalCompositeOperation = 'source-over';
      g.globalAlpha = a * .38;
      g.fillStyle = 'rgba(52,34,28,0.62)';
      g.beginPath(); g.arc(p.x, p.y, Math.max(1, s * .55), 0, Math.PI * 2); g.fill();
    }
    g.globalCompositeOperation = blend;
    g.globalAlpha = a;
    const sprite = p.c === 'rust' ? SPRITE_RUST : p.c === 'gold' ? SPRITE_GOLD : SPRITE_IVORY;
    g.drawImage(sprite, p.x - s / 2, p.y - s / 2, s, s);
  }
  g.restore();
}

function particleRing(cx, cy, radius, count, seed, opts = {}) {
  const r = mulberry32(seed);
  const pts = [];
  for (let i = 0; i < count; i++) {
    const a = r() * Math.PI * 2;
    const rr = radius + (r() - .5) * (opts.spread || 10);
    pts.push({
      x: cx + Math.cos(a) * rr,
      y: cy + Math.sin(a) * rr,
      s: rndRange(r, opts.minS || 1.2, opts.maxS || 2.8),
      a: rndRange(r, opts.minA || .22, opts.maxA || .62),
      c: r() > .82 ? 'gold' : (r() > .95 ? 'rust' : 'ivory')
    });
  }
  return pts;
}

function gearSilhouettePoints(cx, cy, angle, count, seed, opts = {}) {
  const r = mulberry32(seed);
  const pts = [];
  const R = 118, body = 100;
  for (let i = 0; i < count; i++) {
    let x, y;
    if (r() < .72) {
      const a = r() * Math.PI * 2;
      const rr = Math.sqrt(r()) * body;
      x = Math.cos(a) * rr; y = Math.sin(a) * rr;
      if (Math.hypot(x, y) < 32) { i--; continue; }
    } else {
      const a = r() * Math.PI * 2;
      const rr = R - 6 + r() * 20;
      x = Math.cos(a) * rr; y = Math.sin(a) * rr;
    }
    const ca = Math.cos(angle), sa = Math.sin(angle);
    pts.push({
      x: cx + x * ca - y * sa,
      y: cy + x * sa + y * ca,
      s: rndRange(r, 1.0, 2.4),
      a: rndRange(r, opts.minA || .18, opts.maxA || .52),
      c: opts.rust && r() < .22 ? 'rust' : (r() < .1 ? 'gold' : 'ivory')
    });
  }
  return pts;
}

/* ---------- world: desk, page, objects ---------- */
function drawDesk(g) {
  g.fillStyle = C.desk; g.fillRect(0, 0, W, H);
  const grd = g.createRadialGradient(420, 180, 0, 420, 180, 1350);
  grd.addColorStop(0, 'rgba(220,170,120,0.20)');
  grd.addColorStop(.45, 'rgba(120,82,50,0.08)');
  grd.addColorStop(1, 'rgba(20,14,11,0)');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  const v = g.createRadialGradient(960, 540, 420, 960, 540, 1080);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

function drawPage(g) {
  // page shadow
  g.save();
  g.filter = 'blur(32px)';
  g.fillStyle = 'rgba(0,0,0,0.62)';
  g.fillRect(226, 112, 1500, 900);
  g.restore();

  g.drawImage(PAPER, 210, 90);

  // page edge + warm highlight
  g.save();
  g.strokeStyle = 'rgba(70,45,25,0.42)'; g.lineWidth = 2;
  g.strokeRect(210, 90, 1500, 900);
  const hl = g.createLinearGradient(210, 90, 780, 480);
  hl.addColorStop(0, 'rgba(255,240,210,0.18)');
  hl.addColorStop(1, 'rgba(255,240,210,0)');
  g.fillStyle = hl; g.fillRect(210, 90, 1500, 900);
  g.restore();
}

function drawWashes(g) {
  // distant warm sky / low sun, then ochre around the bench, violet shadow
  wash(g, 700, 260, 560, 300, 'rgba(200,143,118,0.55)', .34, -.08);
  wash(g, 1300, 210, 420, 240, 'rgba(156,138,160,0.45)', .24, .06);
  wash(g, 980, 720, 430, 280, 'rgba(222,190,135,0.55)', .38, .02);
  wash(g, 1460, 790, 300, 190, 'rgba(200,143,118,0.45)', .18, -.06);
  wash(g, 520, 790, 360, 220, 'rgba(124,90,70,0.30)', .16, .08);
  // wet blooms and a closer ochre pool around the bench
  wash(g, 1420, 300, 120, 90, 'rgba(200,143,118,0.55)', .28, .2);
  wash(g, 360, 520, 140, 110, 'rgba(156,138,160,0.40)', .16, -.1);
  wash(g, 1220, 760, 360, 260, 'rgba(200,143,118,0.45)', .18, .05);
  wash(g, 760, 500, 300, 220, 'rgba(222,190,135,0.45)', .16, -.04);
}

function drawGrid(g) {
  g.save();
  g.strokeStyle = 'rgba(52,34,28,0.055)';
  g.lineWidth = 1;
  for (let x = 270; x < 1680; x += 120) {
    g.beginPath(); g.moveTo(x, 120); g.lineTo(x, 960); g.stroke();
  }
  for (let y = 150; y < 960; y += 120) {
    g.beginPath(); g.moveTo(240, y); g.lineTo(1680, y); g.stroke();
  }
  // margin ticks
  g.strokeStyle = 'rgba(52,34,28,0.16)';
  for (let i = 0; i < 9; i++) {
    g.beginPath(); g.moveTo(222, 150 + i * 90); g.lineTo(238, 150 + i * 90); g.stroke();
  }
  g.restore();
}

function drawPencilUnderlay(g) {
  g.save();
  // construction geometry under the wash; visible as faint graphite
  roughCircle(g, 940, 660, 166, 'rgba(58,54,58,0.16)', 1.1, 9101, .65);
  roughCircle(g, 940, 660, 188, 'rgba(58,54,58,0.10)', .9, 9102, .55);
  roughLine(g, [[770, 660], [1110, 660]], 'rgba(58,54,58,0.10)', 1, 9103, .55);
  roughLine(g, [[940, 490], [940, 830]], 'rgba(58,54,58,0.10)', 1, 9104, .55);
  roughLine(g, [[240, 440], [270, 440], [270, 410]], 'rgba(58,54,58,0.16)', 1, 9105, .50);
  for (let i = 0; i < 7; i++) {
    const x = 260 + i * 120;
    roughLine(g, [[x, 948], [x + 18, 966]], 'rgba(58,54,58,0.09)', .8, 9110 + i, .45);
  }
  g.restore();
}

function drawTicket(g) {
  g.save();
  g.translate(240, 120);
  // shadow + paper
  g.save(); g.filter = 'blur(12px)'; g.fillStyle = 'rgba(50,30,18,0.35)';
  g.fillRect(10, 14, 620, 320); g.restore();
  g.fillStyle = 'rgba(247,238,216,0.97)';
  g.fillRect(0, 0, 620, 320);
  g.strokeStyle = 'rgba(52,34,28,0.58)'; g.lineWidth = 2;
  g.strokeRect(0, 0, 620, 320);
  g.strokeStyle = 'rgba(52,34,28,0.20)'; g.lineWidth = 1;
  g.strokeRect(10, 10, 600, 300);

  drawText(g, '装配日志', 30, 54, 28, C.ink, { weight: 600 });
  drawText(g, '07', 582, 54, 30, C.rust, { weight: 700, align: 'right' });
  g.strokeStyle = 'rgba(52,34,28,0.35)'; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(30, 82); g.lineTo(590, 82); g.stroke();

  drawText(g, '齿轮入座', 30, 135, 44, C.ink, { weight: 700 });
  drawText(g, '卡榫朝上', 30, 195, 36, C.ink, { weight: 600 });
  drawText(g, 'A 座 · 12 点', 30, 248, 24, C.ink, { weight: 400 });

  // little spec diagram
  g.save();
  g.translate(492, 205);
  g.strokeStyle = C.ink; g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, 38, 0, Math.PI * 2); g.stroke();
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI * 2 / 12;
    g.save(); g.rotate(a); g.strokeRect(-4, -48, 8, 12); g.restore();
  }
  g.fillStyle = C.rust;
  g.fillRect(-4, -46, 8, 16);
  g.strokeStyle = C.rust; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-58, -38); g.lineTo(-58, -8); g.lineTo(-40, -8); g.stroke();
  drawText(g, '12', -58, -54, 16, C.rust, { weight: 600, align: 'center' });
  g.restore();

  // pencil note
  drawText(g, '先对准，再落下', 30, 290, 18, 'rgba(58,54,58,0.62)', { weight: 400 });
  g.restore();
}

function drawSocket(g, alpha = 1) {
  const cx = 940, cy = 660;
  g.save();
  g.globalAlpha = alpha;
  softShadow(g, cx + 6, cy + 16, 180, 150, 'rgba(45,28,16,0.30)', 20);

  const grd = g.createRadialGradient(cx - 30, cy - 30, 10, cx, cy, 150);
  grd.addColorStop(0, 'rgba(238,207,150,0.38)');
  grd.addColorStop(.7, 'rgba(190,150,100,0.16)');
  grd.addColorStop(1, 'rgba(120,85,55,0.06)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(cx, cy, 150, 0, Math.PI * 2); g.fill();

  roughCircle(g, cx, cy, 150, C.ink, 3.2, 811, .95);
  roughCircle(g, cx, cy, 122, C.ink, 2.0, 812, .80);
  roughCircle(g, cx, cy, 96, 'rgba(52,34,28,0.24)', 1.2, 813, .7);

  // 12 o'clock tick
  g.save();
  g.translate(cx, cy); g.rotate(-Math.PI / 2);
  g.strokeStyle = C.ink; g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, -150); g.lineTo(0, -128); g.stroke();
  g.strokeStyle = C.rust; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-10, -156); g.lineTo(0, -146); g.lineTo(10, -156); g.stroke();
  g.restore();

  // four small ticks
  for (const a of [0, Math.PI / 2, Math.PI, Math.PI * 1.5]) {
    g.save(); g.translate(cx, cy); g.rotate(a);
    g.strokeStyle = 'rgba(52,34,28,0.55)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, -150); g.lineTo(0, -138); g.stroke();
    g.restore();
  }

  drawText(g, 'A 座', cx + 170, cy + 14, 24, C.ink, { weight: 600, halo: 'rgba(240,228,200,0.55)' });
  g.restore();
}

function drawGear(g, cx, cy, angle, alpha = 1) {
  g.save();
  g.globalAlpha = alpha;
  softShadow(g, cx + 8, cy + 14, 126, 108, 'rgba(45,28,16,0.34)', 18);
  g.translate(cx, cy); g.rotate(angle);
  g.drawImage(GEAR, -190, -190);
  g.restore();
}

function drawArm(g) {
  const base = { x: 1500, y: 262 };
  const elbow = { x: 1340, y: 352 };
  const wrist = { x: 1230, y: 458 };
  const tip = { x: 1175, y: 500 };
  const joints = [base, elbow, wrist, tip];

  // soft shadow
  softShadow(g, 1330, 470, 230, 60, 'rgba(45,28,16,0.22)', 24);

  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  // ink outline
  g.strokeStyle = 'rgba(52,34,28,0.72)'; g.lineWidth = 32;
  g.beginPath(); g.moveTo(base.x, base.y); g.lineTo(elbow.x, elbow.y); g.lineTo(wrist.x, wrist.y); g.lineTo(tip.x, tip.y); g.stroke();
  // brass body
  g.strokeStyle = C.brass; g.lineWidth = 22;
  g.beginPath(); g.moveTo(base.x, base.y); g.lineTo(elbow.x, elbow.y); g.lineTo(wrist.x, wrist.y); g.lineTo(tip.x, tip.y); g.stroke();
  // highlight
  g.strokeStyle = 'rgba(255,236,190,0.45)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(base.x - 6, base.y - 4); g.lineTo(elbow.x - 6, elbow.y - 4); g.lineTo(wrist.x - 5, wrist.y - 4); g.stroke();

  // joints
  for (const p of joints) {
    g.fillStyle = C.brass; g.strokeStyle = C.ink; g.lineWidth = 3;
    g.beginPath(); g.arc(p.x, p.y, 17, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,240,200,0.65)';
    g.beginPath(); g.arc(p.x - 5, p.y - 5, 5, 0, Math.PI * 2); g.fill();
  }
  // gripper fingers
  g.strokeStyle = C.ink; g.lineWidth = 10; g.lineCap = 'round';
  g.beginPath(); g.moveTo(tip.x, tip.y); g.lineTo(tip.x - 34, tip.y - 26); g.stroke();
  g.beginPath(); g.moveTo(tip.x, tip.y); g.lineTo(tip.x - 30, tip.y + 30); g.stroke();
  g.strokeStyle = C.brass; g.lineWidth = 5;
  g.beginPath(); g.moveTo(tip.x, tip.y); g.lineTo(tip.x - 34, tip.y - 26); g.stroke();
  g.beginPath(); g.moveTo(tip.x, tip.y); g.lineTo(tip.x - 30, tip.y + 30); g.stroke();

  // indicator light
  g.fillStyle = C.ivory;
  g.beginPath(); g.arc(base.x - 2, base.y - 28, 7, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(52,34,28,0.5)'; g.lineWidth = 1.4; g.stroke();

  // pencil construction marks
  g.strokeStyle = 'rgba(58,54,58,0.25)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(base.x + 18, base.y + 22); g.lineTo(elbow.x + 18, elbow.y + 22); g.stroke();
  g.beginPath(); g.arc(elbow.x, elbow.y, 30, 0, Math.PI * 2); g.stroke();
  g.restore();
}

function drawSeal(g, text, cx, cy, w, h, color, textColor, alpha = .95, seed = 1) {
  g.save();
  const baseAlpha = g.globalAlpha;
  g.globalAlpha = baseAlpha * alpha;
  // wet bloom under the stamp
  wash(g, cx, cy + 8, w * .62, h * .58, color, .20, -.03);

  const c = document.createElement('canvas');
  c.width = w + 40; c.height = h + 40;
  const s = c.getContext('2d');
  const r = mulberry32(seed);
  s.translate(20, 20);

  const drawShape = (grow) => {
    if (text === '未完成') {
      s.beginPath(); s.arc(w / 2, h / 2, Math.min(w, h) / 2 - 6 - grow, 0, Math.PI * 2);
    } else {
      const rr = 10;
      const x = -grow, y = -grow, ww = w + grow * 2, hh = h + grow * 2;
      s.beginPath();
      s.moveTo(x + rr, y); s.lineTo(x + ww - rr, y); s.quadraticCurveTo(x + ww, y, x + ww, y + rr);
      s.lineTo(x + ww, y + hh - rr); s.quadraticCurveTo(x + ww, y + hh, x + ww - rr, y + hh);
      s.lineTo(x + rr, y + hh); s.quadraticCurveTo(x, y + hh, x, y + hh - rr);
      s.lineTo(x, y + rr); s.quadraticCurveTo(x, y, x + rr, y);
    }
  };

  // base
  s.fillStyle = color; drawShape(0); s.fill();
  s.strokeStyle = 'rgba(52,34,28,0.62)'; s.lineWidth = 3.5; drawShape(2); s.stroke();

  // ink texture holes
  s.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 34; i++) {
    const x = r() * w, y = r() * h, rad = 1 + r() * 4;
    s.globalAlpha = .25 + r() * .45;
    s.beginPath(); s.arc(x, y, rad, 0, Math.PI * 2); s.fill();
  }
  s.globalAlpha = 1; s.globalCompositeOperation = 'source-over';

  // text
  const size = text === '未完成' ? Math.min(64, w / 3.55) : Math.min(72, h * .58);
  s.font = `700 ${size}px ${FONT}`;
  s.textAlign = 'center'; s.textBaseline = 'middle';
  s.fillStyle = textColor;
  s.fillText(text, w / 2, h / 2 + 2);

  // rough double ring / border accent
  s.strokeStyle = 'rgba(240,228,200,0.36)'; s.lineWidth = 1.4;
  if (text === '未完成') {
    s.beginPath(); s.arc(w / 2, h / 2, Math.min(w, h) / 2 - 18, 0, Math.PI * 2); s.stroke();
  } else {
    s.strokeRect(10, 10, w - 20, h - 20);
  }

  g.save();
  g.translate(cx - w / 2, cy - h / 2);
  g.rotate(text === '未完成' ? .035 : -.028);
  g.drawImage(c, -20, -20);
  g.restore();
  g.restore();
}

function drawSpecGhost(g) {

function drawCorrection(g, alpha = 1) {
  g.save();
  g.globalAlpha = alpha;
  const cx = 940, cy = 660, rad = 176;
  const a0 = -Math.PI / 2 - (23 * Math.PI / 180);
  const a1 = -Math.PI / 2;
  const p0 = [cx + Math.cos(a0) * rad, cy + Math.sin(a0) * rad];
  const p1 = [cx + Math.cos(a1) * rad, cy + Math.sin(a1) * rad];
  const grd = g.createLinearGradient(p0[0], p0[1], p1[0], p1[1]);
  grd.addColorStop(0, C.rust);
  grd.addColorStop(1, C.ivory);
  g.strokeStyle = grd; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.arc(cx, cy, rad, a0, a1); g.stroke();
  // arrowhead at target
  const tang = a1 + Math.PI / 2;
  g.fillStyle = C.ivory;
  g.beginPath();
  g.moveTo(p1[0], p1[1]);
  g.lineTo(p1[0] - Math.cos(tang + .45) * 18, p1[1] - Math.sin(tang + .45) * 18);
  g.lineTo(p1[0] - Math.cos(tang - .45) * 18, p1[1] - Math.sin(tang - .45) * 18);
  g.closePath(); g.fill();

  // translation arrow
  const ax = 955, ay = 645, bx = 940, by = 660;
  g.strokeStyle = C.ivory; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx + 5, by - 5); g.stroke();
  g.fillStyle = C.ivory;
  g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + 16, by - 7); g.lineTo(bx + 8, by - 18); g.closePath(); g.fill();

  // angle label on arc
  drawText(g, '+23°', cx + 146, cy - 124, 26, C.rust, { weight: 700, halo: 'rgba(240,228,200,0.55)' });
  g.restore();
}

function drawGhostGear(g) {

  }

    softShadow(g, 1420, 790, 160, 26, 'rgba(45,28,16,0.26)', 14);

    drawText(g, '旋转 +23°', 980, 220, 32, C.ink, { weight: 600, halo: 'rgba(240,228,200,0.55)' });
    drawText(g, '内推 6.2 mm', 980, 280, 32, C.ink, { weight: 600, halo: 'rgba(240,228,200,0.55)' });
    drawText(g, '模拟演示数据 · 非实测', 980, 338, 18, 'rgba(52,34,28,0.62)', { weight: 400 });
    drawText(g, '纠正指令 · 待执行', 980, 378, 22, C.rust, { weight: 600, halo: 'rgba(240,228,200,0.55)' });
  } else if (shot === 'S07') {
    drawSocket(g, 1);
    drawGear(g, 955, 645, -23 * Math.PI / 180, 1);
    drawGap(g, 1);
    drawSeal(g, '未完成', 1500, 690, 260, 260, C.rust, C.paperLight, .95, 42);
    drawCorrection(g, .55);
    drawParticleLayer(g, shot);
    drawText(g, '旋转 +23°', 980, 220, 26, 'rgba(52,34,28,0.80)', { weight: 600, halo: 'rgba(240,228,200,0.45)' });
    drawText(g, '内推 6.2 mm', 980, 270, 26, 'rgba(52,34,28,0.80)', { weight: 600, halo: 'rgba(240,228,200,0.45)' });
    drawText(g, '模拟演示数据 · 非实测', 980, 318, 17, 'rgba(52,34,28,0.62)', { weight: 400 });

}

function drawClosingLine(g) {
  const y = 892;
  g.save();
  g.font = `700 100px ${FONT}`;
  const a = '动作完成', b = '任务完成';
  const wa = g.measureText(a).width, wb = g.measureText(b).width;
  const symW = 112, gap = 26;
  const total = wa + gap + symW + gap + wb;
  const x0 = (W - total) / 2;
  const symCx = x0 + wa + gap + symW / 2;

  // rust wash beneath the symbol
  wash(g, symCx, y + 2, 90, 66, 'rgba(180,85,63,0.55)', .28, -.04);

  drawText(g, a, x0, y, 100, C.ink, { weight: 700, halo: 'rgba(240,228,200,0.45)' });
  drawText(g, b, x0 + wa + gap + symW + gap, y, 100, C.ink, { weight: 700, halo: 'rgba(240,228,200,0.45)' });

  // hand-stamped not-equal
  g.save();
  g.translate(symCx, y); g.rotate(-.018);
  g.strokeStyle = C.rust; g.lineWidth = 9; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-54, -18); g.lineTo(54, -18); g.stroke();
  g.beginPath(); g.moveTo(-54, 18); g.lineTo(54, 18); g.stroke();
  g.beginPath(); g.moveTo(-26, 48); g.lineTo(26, -48); g.stroke();
  g.globalAlpha = .30; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-58, -24); g.lineTo(58, -24); g.stroke();
  g.beginPath(); g.moveTo(-31, 50); g.lineTo(31, -50); g.stroke();
  g.restore();

  // particle underline, broken at the symbol
  g.save();
  g.strokeStyle = 'rgba(52,34,28,0.22)'; g.lineWidth = 1.2;
  g.beginPath();
  g.moveTo(x0, y + 54); g.lineTo(symCx - 66, y + 54);
  g.moveTo(symCx + 66, y + 54); g.lineTo(x0 + total, y + 54);
  g.stroke();
  g.restore();

  const ur = mulberry32(7008);
  const pts = [];
  for (let i = 0; i < 600; i++) {
    const x = x0 + ur() * total;
    if (x > symCx - 66 && x < symCx + 66) continue;
    pts.push({
      x, y: y + 54 + (ur() - .5) * 9,
      s: rndRange(ur, 1.6, 3.2),
      a: rndRange(ur, .45, .85),
      c: ur() > .78 ? 'gold' : (ur() > .94 ? 'rust' : 'ivory')
    });
  }
  drawParticles(g, pts, 1.15, 1, { halo: true, blend: 'source-over' });

  drawText(g, 'VLM 复核未通过 · 纠正指令已生成', 960, 978, 24, 'rgba(52,34,28,0.80)', { weight: 400, align: 'center', halo: 'rgba(240,228,200,0.55)' });
  g.restore();
}

function drawS05Bright(g) {
  // ghost sage stamp remnant + dissolve flow
  g.save(); g.globalAlpha = .18;
  drawSeal(g, '完成', 1150, 800, 220, 110, C.sage, C.paperLight, 1, 55);
  g.restore();

  const flow = [];
  const fr = mulberry32(7011);
  for (let i = 0; i < 900; i++) {
    const u = fr();
    const p0 = [1150, 800], p1 = [1280, 860], p2 = [1500, 690];
    const x = (1 - u) * (1 - u) * p0[0] + 2 * (1 - u) * u * p1[0] + u * u * p2[0];
    const y = (1 - u) * (1 - u) * p0[1] + 2 * (1 - u) * u * p1[1] + u * u * p2[1];
    flow.push({
      x: x + (fr() - .5) * 34,
      y: y + (fr() - .5) * 28,
      s: rndRange(fr, 1.0, 2.5),
      a: rndRange(fr, .18, .55),
      c: fr() < .18 ? 'rust' : (fr() < .38 ? 'gold' : 'ivory')
    });
  }
  drawParticles(g, flow, 1.25, 1.15);

  // contact map on the gear
  const cp = [];
  const cr = mulberry32(7012);
  for (let i = 0; i < 1800; i++) {
    const a = cr() * Math.PI * 2;
    const rr = Math.sqrt(cr()) * 112;
    if (rr < 34) { i--; continue; }
    const x = 955 + Math.cos(a) * rr, y = 645 + Math.sin(a) * rr;
    const isGap = Math.cos(a + Math.PI * .80) > .58;
    cp.push({
      x, y,
      s: rndRange(cr, 1.0, 2.2),
      a: rndRange(cr, .18, .52),
      c: isGap ? 'rust' : (cr() > .82 ? 'gold' : 'ivory')
    });
  }
  drawParticles(g, cp, 1.2, 1.1);

  drawEvidencePanel(g);
  drawSeal(g, '未完成', 1500, 690, 260, 260, C.rust, C.paperLight, .97, 43);
}

function withAlpha(g, a, fn) {
  if (a <= 0.001) return;
  g.save();
  g.globalAlpha *= a;
  fn();
  g.restore();
}

function applyCamera(g, cam) {
  g.translate(W / 2, H / 2);
  g.scale(cam.z, cam.z);
  g.translate(-cam.cx, -cam.cy);
}

function drawArmPose(g, arm) {
  if (!arm || arm.alpha <= 0.001) return;
  const base = { x: arm.base[0], y: arm.base[1] };
  const elbow = { x: arm.elbow[0], y: arm.elbow[1] };
  const wrist = { x: arm.wrist[0], y: arm.wrist[1] };
  const tip = { x: arm.tip[0], y: arm.tip[1] };
  const joints = [base, elbow, wrist, tip];

  g.save();
  g.globalAlpha *= arm.alpha;
  softShadow(g, (base.x + tip.x) / 2, (base.y + tip.y) / 2 + 90, 230, 60, 'rgba(45,28,16,0.22)', 24);
  g.lineCap = 'round'; g.lineJoin = 'round';

  g.strokeStyle = 'rgba(52,34,28,0.72)'; g.lineWidth = 32;
  g.beginPath(); g.moveTo(base.x, base.y); g.lineTo(elbow.x, elbow.y); g.lineTo(wrist.x, wrist.y); g.lineTo(tip.x, tip.y); g.stroke();

  g.strokeStyle = C.brass; g.lineWidth = 22;
  g.beginPath(); g.moveTo(base.x, base.y); g.lineTo(elbow.x, elbow.y); g.lineTo(wrist.x, wrist.y); g.lineTo(tip.x, tip.y); g.stroke();

  g.strokeStyle = 'rgba(255,236,190,0.45)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(base.x - 6, base.y - 4); g.lineTo(elbow.x - 6, elbow.y - 4); g.lineTo(wrist.x - 5, wrist.y - 4); g.stroke();

  for (const p of joints) {
    g.fillStyle = C.brass; g.strokeStyle = C.ink; g.lineWidth = 3;
    g.beginPath(); g.arc(p.x, p.y, 17, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,240,200,0.65)';
    g.beginPath(); g.arc(p.x - 5, p.y - 5, 5, 0, Math.PI * 2); g.fill();
  }

  g.strokeStyle = C.ink; g.lineWidth = 10;
  g.beginPath(); g.moveTo(tip.x, tip.y); g.lineTo(tip.x - 34, tip.y - 26); g.stroke();
  g.beginPath(); g.moveTo(tip.x, tip.y); g.lineTo(tip.x - 30, tip.y + 30); g.stroke();
  g.strokeStyle = C.brass; g.lineWidth = 5;
  g.beginPath(); g.moveTo(tip.x, tip.y); g.lineTo(tip.x - 34, tip.y - 26); g.stroke();
  g.beginPath(); g.moveTo(tip.x, tip.y); g.lineTo(tip.x - 30, tip.y + 30); g.stroke();

  g.fillStyle = C.ivory;
  g.beginPath(); g.arc(base.x - 2, base.y - 28, 7, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(52,34,28,0.5)'; g.lineWidth = 1.4; g.stroke();

  g.strokeStyle = 'rgba(58,54,58,0.25)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(base.x + 18, base.y + 22); g.lineTo(elbow.x + 18, elbow.y + 22); g.stroke();
  g.beginPath(); g.arc(elbow.x, elbow.y, 30, 0, Math.PI * 2); g.stroke();
  g.restore();
}

function drawScan(g, s) {
  if (s.scan.a <= 0.001) return;
  g.save();
  g.globalAlpha *= s.scan.a;
  g.strokeStyle = 'rgba(246,235,208,0.82)';
  g.lineWidth = 2;
  g.beginPath(); g.moveTo(s.scan.x, 200); g.lineTo(s.scan.x, 900); g.stroke();

  const r = mulberry32(9001);
  const pts = [];
  for (let i = 0; i < PARTICLE_BUDGET.S05.scan; i++) {
    pts.push({
      x: s.scan.x + (r() - .5) * 44,
      y: 220 + r() * 660,
      s: rndRange(r, 1.0, 2.6),
      a: rndRange(r, .18, .62),
      c: r() > .78 ? 'gold' : (r() > .94 ? 'rust' : 'ivory')
    });
  }
  drawParticles(g, pts, 1.05, 1, { blend: 'lighter' });
  g.restore();
}

function drawContactFlow(g, s) {
  if (s.contactAlpha <= 0.001) return;
  g.save();
  g.globalAlpha *= s.contactAlpha;

  const flow = [];
  const fr = mulberry32(7011);
  for (let i = 0; i < 900; i++) {
    const u = fr();
    const p0 = [1150, 800], p1 = [1280, 860], p2 = [1500, 690];
    const x = (1 - u) * (1 - u) * p0[0] + 2 * (1 - u) * u * p1[0] + u * u * p2[0];
    const y = (1 - u) * (1 - u) * p0[1] + 2 * (1 - u) * u * p1[1] + u * u * p2[1];
    flow.push({
      x: x + (fr() - .5) * 34,
      y: y + (fr() - .5) * 28,
      s: rndRange(fr, 1.0, 2.8),
      a: rndRange(fr, .18, .62),
      c: fr() < .18 ? 'rust' : (fr() < .38 ? 'gold' : 'ivory')
    });
  }
  drawParticles(g, flow, 1.25, 1.1, { blend: 'lighter' });

  const cp = [];
  const cr = mulberry32(7012);
  for (let i = 0; i < 1800; i++) {
    const a = cr() * Math.PI * 2;
    const rr = Math.sqrt(cr()) * 112;
    if (rr < 34) { i--; continue; }
    const x = 955 + Math.cos(a) * rr, y = 645 + Math.sin(a) * rr;
    const isGap = Math.cos(a + Math.PI * .80) > .58;
    cp.push({
      x, y,
      s: rndRange(cr, 1.0, 2.4),
      a: rndRange(cr, .18, .58),
      c: isGap ? 'rust' : (cr() > .82 ? 'gold' : 'ivory')
    });
  }
  drawParticles(g, cp, 1.2, 1.1, { blend: 'lighter' });
  g.restore();
}

    g.beginPath(); g.moveTo(-54, 18); g.lineTo(54, 18); g.stroke();
    g.beginPath(); g.moveTo(-26, 48); g.lineTo(26, -48); g.stroke();

const PARTICLE_BUDGET = TL.PARTICLE_BUDGET;

function particleTrail(g, t, count, seed, arm) {
  const r = mulberry32(seed);
  const now = TL.gearAt(t);
  const prev = TL.gearAt(Math.max(0, t - 0.12));
  let dx = now.x - prev.x, dy = now.y - prev.y;
  const speed = Math.hypot(dx, dy);
  if (speed < 0.35) return; // no fake trail before the gear actually moves
  dx /= speed; dy /= speed;
  const nx = -dy, ny = dx;

  function nearArm(x, y) {
    if (!arm || arm.alpha < 0.01) return false;
    const pts = [arm.base, arm.elbow, arm.wrist, arm.tip];
    for (let k = 0; k < pts.length - 1; k++) {
      const x1 = pts[k][0], y1 = pts[k][1], x2 = pts[k + 1][0], y2 = pts[k + 1][1];
      const vx = x2 - x1, vy = y2 - y1;
      const L2 = vx * vx + vy * vy || 1;
      const u = Math.max(0, Math.min(1, ((x - x1) * vx + (y - y1) * vy) / L2));
      const px = x1 + vx * u, py = y1 + vy * u;
      if (Math.hypot(x - px, y - py) < 52) return true;
    }
    return false;
  }

  const pts = [];
  let attempts = 0;
  while (pts.length < count && attempts < count * 3) {
    attempts++;
    // u=0 near the head, u=1 at the tail; power biases density toward the head
    const u = Math.pow(r(), 1.7);
    const age = 0.02 + u * 0.55;
    const base = TL.gearAt(Math.max(0, t - age));
    const lateral = (r() - .5) * (16 + 34 * u);
    const back = 8 + 28 * u;
    const x = base.x - dx * back + nx * lateral;
    const y = base.y - dy * back + ny * lateral;
    if (nearArm(x, y)) continue;
    pts.push({
      x, y,
      s: 1.8 + 2.6 * (1 - u) + r() * .4,
      a: Math.min(.9, .35 + .5 * (1 - u) + r() * .1),
      c: r() > .34 ? 'gold' : (r() > .72 ? 'rust' : 'ivory')
    });
  }
  drawParticles(g, pts, 1.1, 1, { halo: true, blend: 'source-over' });
}

function particleArc(g, cx, cy, radius, a0, a1, count, seed, alpha = 1) {
  const r = mulberry32(seed);
  const pts = [];
  for (let i = 0; i < count; i++) {
    const u = r();
    const a = a0 + (a1 - a0) * u;
    const rr = radius + (r() - .5) * 10;
    pts.push({
      x: cx + Math.cos(a) * rr,
      y: cy + Math.sin(a) * rr,
      s: rndRange(r, 2.4, 4.4),
      a: rndRange(r, .50, .85),
      c: r() > .80 ? 'gold' : (r() > .94 ? 'rust' : 'ivory')
    });
  }
  drawParticles(g, pts, 1.1, alpha, { halo: true, blend: 'source-over' });
}

function renderAt(time) {
  const s = TL.stateAt(TL.clamp(time, 0, TL.DURATION));
  const diagTarget = window.__particleDiag && window.__particleDiag.target;
  const diagOff = target => diagTarget === target;

  ctx.save();
  ctx.fillStyle = C.desk; ctx.fillRect(0, 0, W, H);
  ctx.restore();

  ctx.save();
  applyCamera(ctx, s.camera);
  drawDesk(ctx); drawPage(ctx);
  ctx.save();
  ctx.beginPath(); ctx.rect(210, 90, 1500, 900); ctx.clip();

  drawWashes(ctx); drawGrid(ctx); drawPencilUnderlay(ctx);
  withAlpha(ctx, s.ticketAlpha, () => drawTicket(ctx));
  drawSocket(ctx, 1);
  drawGear(ctx, s.gear.x, s.gear.y, s.gear.angle, 1);
  withAlpha(ctx, s.gapAlpha, () => drawGap(ctx, 1));

  if (s.t < 2.0) {
    drawParticles(ctx, particleRing(940, 660, 178, PARTICLE_BUDGET.S01, 7001, { spread: 14, minS: 2.0, maxS: 4.0, minA: .55, maxA: .90 }), 1, 1, { halo: true, blend: 'source-over' });
  }
  if (s.t >= 4.4 && s.t < 6.4) {
    drawParticles(ctx, particleRing(940, 660, 176, 400, 7003, { spread: 16, minS: 2.0, maxS: 4.0, minA: .50, maxA: .85 }), 1, 1, { halo: true, blend: 'source-over' });
    drawParticles(ctx, particleRing(842, 766, 72, 80, 7004, { spread: 8, minS: 1.8, maxS: 3.2, minA: .40, maxA: .70 }), 1, .9, { halo: true, blend: 'source-over' });
  }
  if (s.t >= 6.4 && s.t < 8.4) {
    drawParticles(ctx, particleRing(955, 645, 118, PARTICLE_BUDGET.S04, 7005, { spread: 6 }), 1, .95, { halo: true, blend: 'source-over' });
  }

  drawArmPose(ctx, s.arm);
  if (!diagOff('S02') && s.t >= 2.8 && s.t < 4.4) {
    particleTrail(ctx, s.t, PARTICLE_BUDGET.S02, 7002, s.arm);
  }
  withAlpha(ctx, s.doneStampAlpha, () => drawSeal(ctx, '完成', 1150, 800, 220, 110, C.sage, C.paperLight, 1, 31));
  withAlpha(ctx, s.specGhostAlpha, () => drawSpecGhost(ctx));
  if (s.caliperAlpha > 0.001) withAlpha(ctx, s.caliperAlpha, () => drawCaliper(ctx));
  if (s.t >= 11.8) withAlpha(ctx, s.failStampAlpha, () => drawSeal(ctx, '未完成', 1500, 690, 260, 260, C.rust, C.paperLight, 1, 43));
  withAlpha(ctx, s.correctionAlpha, () => drawCorrection(ctx, 1));
  withAlpha(ctx, s.ghostGearAlpha, () => drawGhostGear(ctx));
  if (!diagOff('S06') && s.ghostGearAlpha > 0.001) {
    drawParticles(ctx, TL.ghostGearPoints(940, 660, PARTICLE_BUDGET.S06.ghost, 7006), 1, s.ghostGearAlpha, { halo: true, blend: 'source-over' });
    particleArc(ctx, 940, 660, 178, -Math.PI / 2 - (23 * Math.PI / 180), -Math.PI / 2, PARTICLE_BUDGET.S06.path, 7009, s.ghostGearAlpha);
  }
  drawCorrectionLabels(ctx, s);
  drawClosingFilm(ctx, s);

  ctx.restore(); // page clip
  ctx.restore(); // camera

  if (s.dark < 0.999) {
    ctx.save();
    ctx.fillStyle = `rgba(16,11,9,${(1 - s.dark).toFixed(4)})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.save();
    applyCamera(ctx, s.camera);
    drawScan(ctx, s);
    drawContactFlow(ctx, s);
    drawEvidencePanelFilm(ctx, s);
    if (s.t < 11.8) withAlpha(ctx, s.failStampAlpha, () => drawSeal(ctx, '未完成', 1500, 690, 260, 260, C.rust, C.paperLight, 1, 43));
    ctx.restore();
  }

  drawFilmHeaders(ctx, s);

  ctx.save();
  ctx.globalAlpha = .40;
  drawText(ctx, 'MA341-DEMO-001 · picture-lock · 模拟演示数据', 1700, 1036, 16, C.ivory, { weight: 400, align: 'right' });
  ctx.restore();

  return s;
}

function hashCanvas() {
  const data = ctx.getImageData(0, 0, W, H).data;
  let h = 2166136261;
  for (let i = 0; i < data.length; i += 4) {
    h ^= data[i]; h = Math.imul(h, 16777619);
    h ^= data[i + 1]; h = Math.imul(h, 16777619);
    h ^= data[i + 2]; h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
}

function projectScreen(cam, x, y) {
  return [W / 2 + (x - cam.cx) * cam.z, H / 2 + (y - cam.cy) * cam.z];
}

function particleDiagCapture(t, target) {
  const s = TL.stateAt(TL.clamp(t, 0, TL.DURATION));
  const prev = window.__particleDiag;
  try {
    window.__particleDiag = { target: null };
    renderAt(t);
    const aData = ctx.getImageData(0, 0, W, H);
    const a = new Uint8ClampedArray(aData.data);
    const aURL = ctx.canvas.toDataURL('image/png');

    window.__particleDiag = { target };
    renderAt(t);
    const bData = ctx.getImageData(0, 0, W, H);
    const b = new Uint8ClampedArray(bData.data);
    const bURL = ctx.canvas.toDataURL('image/png');

    const cx = target === 'S02' ? s.gear.x : 940;
    const cy = target === 'S02' ? s.gear.y : 660;
    const rad = target === 'S02' ? 240 : 210;
    const corners = [
      projectScreen(s.camera, cx - rad, cy - rad),
      projectScreen(s.camera, cx + rad, cy - rad),
      projectScreen(s.camera, cx - rad, cy + rad),
      projectScreen(s.camera, cx + rad, cy + rad)
    ];
    const x0 = Math.max(0, Math.floor(Math.min(...corners.map(p => p[0]))));
    const y0 = Math.max(0, Math.floor(Math.min(...corners.map(p => p[1]))));
    const x1 = Math.min(W - 1, Math.ceil(Math.max(...corners.map(p => p[0]))));
    const y1 = Math.min(H - 1, Math.ceil(Math.max(...corners.map(p => p[1]))));

    const out = ctx.createImageData(W, H);
    let diffPixels = 0, sum = 0, maxAbs = 0, minX = W, minY = H, maxX = -1, maxY = -1;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        const d = Math.max(
          Math.abs(a[i] - b[i]),
          Math.abs(a[i + 1] - b[i + 1]),
          Math.abs(a[i + 2] - b[i + 2])
        );
        const v = d > 4 ? Math.min(255, Math.round(d * 7)) : 0;
        out.data[i] = v;
        out.data[i + 1] = Math.round(v * .32);
        out.data[i + 2] = Math.round(v * .08);
        out.data[i + 3] = 255;
        if (x >= x0 && x <= x1 && y >= y0 && y <= y1) {
          if (d > 12) {
            diffPixels++;
            sum += d;
            maxAbs = Math.max(maxAbs, d);
            minX = Math.min(minX, x); minY = Math.min(minY, y);
            maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
          }
        }
      }
    }
    const cCanvas = document.createElement('canvas');
    cCanvas.width = W; cCanvas.height = H;
    cCanvas.getContext('2d').putImageData(out, 0, 0);
    const roiPixels = Math.max(1, (x1 - x0 + 1) * (y1 - y0 + 1));
    return {
      a: aURL,
      b: bURL,
      c: cCanvas.toDataURL('image/png'),
      stats: {
        target,
        t: TL.clamp(t, 0, TL.DURATION),
        frame: Math.round(t * TL.FPS),
        roi: { x0, y0, x1, y1, width: x1 - x0 + 1, height: y1 - y0 + 1 },
        roi_pixels: roiPixels,
        diff_pixels: diffPixels,
        coverage: diffPixels / roiPixels,
        mean_abs: diffPixels ? sum / diffPixels : 0,
        max_abs: maxAbs,
        bbox: diffPixels ? { x0: minX, y0: minY, x1: maxX, y1: maxY } : null
      }
    };
  } finally {
    window.__particleDiag = prev;
    renderAt(t);
  }
}

function boot() {
  renderAt(initialT);
  window.__seek = function (t) {
    const tt = TL.clamp(Number(t), 0, TL.DURATION);
    renderAt(tt);
    return { t: tt, frame: Math.round(tt * TL.FPS) };
  };
  window.__renderHash = hashCanvas;
  window.__filmState = function (t) { return TL.stateAt(TL.clamp(Number(t), 0, TL.DURATION)); };
  window.__particleBudget = PARTICLE_BUDGET;
  window.__particleDiagCapture = particleDiagCapture;
  window.__ready = true;
  document.title = 'READY · ' + initialT.toFixed(2) + 's';
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(boot).catch(boot);
} else {
  boot();
}
})();
</script>
</body>
</html>
