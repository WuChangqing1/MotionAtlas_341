# 仅作示例。由 DeepSeek Harness 检查当前 Nginx 站点与监听端口后再启用。
# 静态服务独立监听 HTTP 18093；不在这里替换主域名 443 配置。
server {
    listen 18093;
    server_name _;
    root /srv/motion-atlas/web;
    index index.html;
    autoindex off;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/motion-atlas-access.log;
    error_log /var/log/nginx/motion-atlas-error.log warn;
}
